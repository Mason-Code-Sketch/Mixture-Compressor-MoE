model:
  name: Qwen1.5-MoE-A2.7B
  path: ../../../../data/models/Qwen1.5-MoE-A2.7B
  architecture: qwen2_moe

current_project_config: ../../../moe-ptq/configs/model-qwen1.5-moe-a2.7b.yaml


dataset:
  calibration:
    path: ../../../../data/datasets/wikitext2
    protocol: corpus_windows
    add_special_tokens: true
    split: train
  evaluation:
    path: ../../../../data/datasets/c4_gptq_new_seed0
    protocol: gptq_c4_new
    split: validation

calibration:
  samples: 128
  seq_len: 2048

gptq:
  group_size: 128
  block_size: 128
  percdamp: 0.01
  mse: true
  reproduce_mcmoe: true

pmq:
  candidate_bits: [1, 2, 3]
  shared_expert_bit: 3
  alpha: 1.0
  beta: 1.5
  normalize_factors: true
  scale_factor: 1000.0
  ilp_backend: highs
  output_dir: results/qwen1.5-moe-a2.7b
