model:
  name: Mixtral-8x7B-v0.1
  id: Mixtral-8x7B-v0.1
  architecture: mixtral
  dtype: float16
  attn_implementation: eager


dataset:
  calibration:
    name: wikitext2
    protocol: corpus_windows
    add_special_tokens: true
    split: train
  evaluations:
    c4:
      name: c4_gptq_new_seed0
      protocol: gptq_c4_new
      split: validation
      text_count: 1100
      seq_len: 2048
      max_blocks: 256
    wikitext2:
      name: wikitext2
      protocol: corpus_windows
      add_special_tokens: true
      split: test
      seq_len: 2048
      max_blocks: 256

calibration:
  samples: 128
  seq_len: 2048

quantization:
  group_size: 128
  candidate_quantizer: normal

pmq:
  candidate_bits: [1, 2, 3]
  shared_expert_bit: 3
  alpha: 1.0
  beta: 1.5
  normalize_factors: true
  scale_factor: 1000.0
  ilp_backend: highs
  output_dir: results/mixtral-8x7b-v0.1
